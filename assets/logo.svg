<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="uemcp-title uemcp-desc">
  <title id="uemcp-title">UEMCP</title>
  <desc id="uemcp-desc">U-shaped bridge mark: two port nodes joined by a curved span with a diamond gateway node, above the UEMCP wordmark.</desc>

  <!-- Mark: 40-unit stroke (= 2.5 px at 32x32) -->
  <g fill="none" stroke="#0B1220" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 94 V214 A106 106 0 0 0 362 214 V94"/>
  </g>
  <circle cx="150" cy="94" r="40" fill="#0B1220"/>
  <circle cx="362" cy="94" r="40" fill="#0B1220"/>
  <path d="M256 284 L292 320 L256 356 L220 320 Z" fill="#0891B2"/>

  <!-- Wordmark: monoline paths, no font dependency -->
  <g fill="none" stroke="#0B1220" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M90 402 V436 A24 24 0 0 0 138 436 V402"/>
    <path d="M212 402 H164 V460 H212"/>
    <path d="M164 431 H206"/>
    <path d="M238 460 V402 L262 436 L286 402 V460"/>
    <path d="M355 409 A29 29 0 1 0 355 453"/>
    <path d="M386 460 V402 H409 A17 17 0 0 1 409 436 H386"/>
  </g>
</svg>
